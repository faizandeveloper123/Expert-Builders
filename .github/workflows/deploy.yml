name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  VPS_HOST: ${{ vars.VPS_HOST || '81.17.101.93' }}
  VPS_USER: ${{ vars.VPS_USER || 'root' }}

permissions:
  contents: read

concurrency:
  group: expert-builders-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package deploy artifact
        run: |
          tar -czf expert-builders-deploy.tar.gz dist api/index.php

      - name: Upload and deploy to VPS
        run: |
          cat > /tmp/expert-builders-deploy.sh <<'REMOTE'
          set -e
          APP=/var/www/expert-developers
          ARCHIVE=/tmp/expert-builders-deploy.tar.gz
          STAMP=$(date +%Y%m%d_%H%M%S)
          STAGE="$APP/.github_stage_$STAMP"
          OLD="$APP/dist_previous_$STAMP"
          BACKUP="$APP/deploy_backup_$STAMP"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ -d "$OLD" ]; then
              rm -rf "$APP/dist"
              mv "$OLD" "$APP/dist"
            fi
            rm -rf "$STAGE"
            exit "$status"
          }
          trap cleanup EXIT
          test -d "$APP"
          test -f "$APP/api/config.php"
          test -f "$APP/api/mail_secrets.php"
          test -f "$ARCHIVE"
          umask 077
          mkdir "$STAGE" "$BACKUP"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          test -f "$STAGE/dist/index.html"
          test -f "$STAGE/api/index.php"
          php -l "$STAGE/api/index.php"
          nginx -t
          cp -a "$APP/dist" "$BACKUP/dist"
          cp -a "$APP/api" "$BACKUP/api"
          CONFIG_BEFORE=$(sha256sum "$APP/api/config.php" | cut -d " " -f1)
          cp "$STAGE/api/index.php" "$APP/api/index.php.new"
          chown www-data:www-data "$APP/api/index.php.new"
          chmod 0644 "$APP/api/index.php.new"
          mv "$APP/dist" "$OLD"
          mv "$STAGE/dist" "$APP/dist"
          mv -f "$APP/api/index.php.new" "$APP/api/index.php"
          chown -R www-data:www-data "$APP/dist"
          CONFIG_AFTER=$(sha256sum "$APP/api/config.php" | cut -d " " -f1)
          test "$CONFIG_BEFORE" = "$CONFIG_AFTER"
          php -l "$APP/api/index.php"
          printf 'DEPLOYED_AT=%s\nBACKUP=%s\nCONFIG_PRESERVED=%s\n' "$STAMP" "$BACKUP" "$CONFIG_AFTER"
          rm -rf "$STAGE" "$ARCHIVE"
          trap - EXIT
          REMOTE
          scp expert-builders-deploy.tar.gz "$VPS_USER@$VPS_HOST:/tmp/expert-builders-deploy.tar.gz"
          scp /tmp/expert-builders-deploy.sh "$VPS_USER@$VPS_HOST:/tmp/expert-builders-deploy.sh"
          ssh "$VPS_USER@$VPS_HOST" 'bash /tmp/expert-builders-deploy.sh'
          ssh "$VPS_USER@$VPS_HOST" 'rm -f /tmp/expert-builders-deploy.sh'
