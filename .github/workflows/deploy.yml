name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'expert-builders' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || '' }}

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static app to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete --exclude ".*"

      - name: Deploy PHP API to S3
        run: aws s3 sync api/ s3://${{ env.S3_BUCKET }}/api/ --delete --exclude ".*"

      - name: Upload nginx config
        run: aws s3 cp nginx-expert-builders.conf s3://${{ env.S3_BUCKET }}/nginx-expert-builders.conf

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Output deployment info
        run: echo "Deployed to s3://${{ env.S3_BUCKET }} (region ${{ env.AWS_REGION }})"