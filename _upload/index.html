<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Expert Builders &amp; Developers CRM</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    html, body { height: 100%; margin: 0; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #334155; }
    .wrap { text-align: center; }
    .spin { width: 56px; height: 56px; border: 5px solid #e2e8f0; border-top-color: #0A58A3; border-radius: 50%; margin: 0 auto 18px; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    p { font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <p>Opening Expert Builders &amp; Developers CRM…</p>
  </div>
</body>
</html>
