# Expert Builders & Developers CRM (React SPA + PHP api)
# Replace the example domain / certificate / paths below with your own before deploying.
server {
    listen 80;
    server_name expertbuilders.example.com www.expertbuilders.example.com;
    client_max_body_size 100M;

    # certbot-managed redirect to https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name expertbuilders.example.com www.expertbuilders.example.com;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/expertbuilders.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertbuilders.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/expert-builders/dist;
    index index.html;

    # phpMyAdmin - hidden path + Basic Auth
    location ^~ /dbadmin {
        auth_basic "Restricted Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;
        alias /var/www/phpmyadmin;
        index index.php;
        location ~ ^/dbadmin/(.+\.php)$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/phpmyadmin/$1;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # API entrypoint with /expert-builders/ prefix (+ PATH_INFO routes)
    location ~ ^/expert-builders/api/index\.php(?:/(.*))?$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(/expert-builders/api/index\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /var/www/expert-builders/api/index.php;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # API entrypoint WITHOUT /expert-builders/ prefix (root-accessed SPA)
    location ~ ^/api/index\.php(?:/(.*))?$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(/api/index\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /var/www/expert-builders/api/index.php;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # other direct php files in api (both /expert-builders/api/ and /api/)
    location ~ ^/(?:expert-builders/)?api/(?<apifile>[^/]+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/expert-builders/api/$apifile;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    location / { try_files $uri $uri/ /index.html; }
}